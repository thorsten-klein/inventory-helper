<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>

  <!-- Clipboard body -->
  <rect x="30" y="25" width="40" height="50" rx="2" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>

  <!-- Clipboard clip -->
  <rect x="42" y="20" width="16" height="8" rx="2" fill="#1e40af"/>

  <!-- Checkmarks -->
  <g stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- First checkmark -->
    <polyline points="36,38 40,42 48,34"/>
    <!-- Second checkmark -->
    <polyline points="36,50 40,54 48,46"/>
    <!-- Third checkmark -->
    <polyline points="36,62 40,66 48,58"/>
  </g>

  <!-- Horizontal lines (list items) -->
  <line x1="52" y1="38" x2="64" y2="38" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="50" x2="64" y2="50" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="62" x2="64" y2="62" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
</svg>
